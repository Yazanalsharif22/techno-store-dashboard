<title>لوحة الطلبات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: top summary bar (today's count + revenue) + scrollable order list, newest first, RTL */
:root {
  --bg: #faf9f6;
  --surface: #ffffff;
  --border: #e8e4db;
  --ink: #2b2620;
  --ink-dim: #8a8172;
  --accent: #b5651d;
  --accent-soft: #f3e4d4;
  --good: #3f7d4f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1915;
    --surface: #252017;
    --border: #3a332a;
    --ink: #f0ece2;
    --ink-dim: #a69a86;
    --accent: #e0a05c;
    --accent-soft: #3a2d1c;
    --good: #7fc794;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1915;
  --surface: #252017;
  --border: #3a332a;
  --ink: #f0ece2;
  --ink-dim: #a69a86;
  --accent: #e0a05c;
  --accent-soft: #3a2d1c;
  --good: #7fc794;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  direction: rtl;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2 { font-family: 'Tajawal', sans-serif; font-weight: 700; text-wrap: balance; }

.wrap { max-width: 760px; margin: 0 auto; padding-block: 28px 60px; }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
header.top h1 { font-size: 1.5rem; margin: 0; }
header.top .store-name { color: var(--ink-dim); font-size: 0.9rem; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; min-width: 0;
}
.stat .label { font-size: 0.78rem; color: var(--ink-dim); margin-bottom: 4px; }
.stat .value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .value.accent { color: var(--accent); }
.stat .value.good { color: var(--good); }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar .filters { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-dim);
  border-radius: 999px; padding: 6px 14px; font-size: 0.85rem; cursor: pointer;
  transition: all .15s ease;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip:hover { border-color: var(--accent); }

button.refresh {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; font-size: 0.85rem; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
button.refresh:hover { border-color: var(--accent); color: var(--accent); }
button.refresh .spin { display: inline-block; transition: transform .4s ease; }
button.refresh.loading .spin { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.list { display: flex; flex-direction: column; gap: 10px; }

.order {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px; min-width: 0;
}
.order .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.order .name { font-weight: 700; font-size: 1.02rem; }
.order .time { color: var(--ink-dim); font-size: 0.78rem; white-space: nowrap; }
.order .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.86rem; color: var(--ink-dim); margin-bottom: 8px; }
.order .meta b { color: var(--ink); font-weight: 600; }
.order .addr { font-size: 0.86rem; color: var(--ink); line-height: 1.5; }
.order .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.order .price { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.order .channel {
  font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-dim);
}

.empty, .error { text-align: center; padding: 50px 16px; color: var(--ink-dim); }
.empty .big { font-size: 2rem; margin-bottom: 8px; }
.error { color: var(--accent); }

button.export {
  border: 1px solid var(--border); background: var(--accent-soft); color: var(--accent);
  border-radius: 999px; padding: 6px 14px; font-size: 0.85rem; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-weight: 600;
}
button.export:hover { border-color: var(--accent); }

.order .items { margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
.order .item-row {
  display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 0.82rem; color: var(--ink);
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
}
.order .item-row .idx { color: var(--ink-dim); font-weight: 600; min-width: 16px; }
.order .qty-badge {
  font-size: 0.72rem; background: var(--accent-soft); color: var(--accent); border-radius: 999px;
  padding: 1px 9px; font-weight: 700;
}

@media (max-width: 480px) {
  .order .row1 { flex-direction: column; gap: 2px; }
}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<div class="wrap">
  <header class="top">
    <div>
      <h1>طلبات اليوم</h1>
      <div class="store-name">techno.stores_jo</div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="export" id="exportBtn" onclick="exportExcel()">⬇️ تصدير إكسل</button>
      <button class="refresh" id="refreshBtn" onclick="loadOrders()">
        <span class="spin">⟳</span> تحديث
      </button>
    </div>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="label">عدد الطلبات</div>
      <div class="value accent" id="statCount">—</div>
    </div>
    <div class="stat">
      <div class="label">إجمالي المبيعات</div>
      <div class="value good" id="statRevenue">—</div>
    </div>
    <div class="stat">
      <div class="label">آخر تحديث</div>
      <div class="value" id="statUpdated" style="font-size:0.95rem; font-weight:500;">—</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="chip" data-filter="today" aria-pressed="true">اليوم</button>
      <button class="chip" data-filter="all" aria-pressed="false">كل الطلبات</button>
    </div>
  </div>

  <div class="list" id="list">
    <div class="empty"><div class="big">⏳</div>جارِ تحميل الطلبات…</div>
  </div>
</div>

<script>
const ENDPOINT = 'https://yazanalsharif.app.n8n.cloud/webhook/store-orders?token=yznmvcavjgcywz8pnvz';
let allOrders = [];
let currentFilter = 'today';

function fmtMoney(n) {
  const num = Number(n || 0);
  return num.toLocaleString('ar-JO', { minimumFractionDigits: num % 1 === 0 ? 0 : 2 }) + ' د.أ';
}

function fmtTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('ar-JO', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short', timeZone: 'Asia/Amman' });
  } catch (e) { return iso; }
}

function isToday(iso) {
  try {
    const d = new Date(iso);
    const now = new Date();
    const fmt = (x) => x.toLocaleDateString('en-CA', { timeZone: 'Asia/Amman' });
    return fmt(d) === fmt(now);
  } catch (e) { return false; }
}

function channelLabel(ch) {
  if (ch === 'instagram') return 'إنستغرام';
  if (ch === 'whatsapp') return 'واتساب';
  return ch || '—';
}

function render() {
  const list = document.getElementById('list');
  const filtered = currentFilter === 'today' ? allOrders.filter(o => isToday(o.created_at)) : allOrders;

  const revenue = filtered.reduce((sum, o) => sum + Number(o.price_jod || 0) + Number(o.delivery_fee_jod || 0), 0);
  document.getElementById('statCount').textContent = filtered.length;
  document.getElementById('statRevenue').textContent = fmtMoney(revenue);
  document.getElementById('statUpdated').textContent = new Date().toLocaleTimeString('ar-JO', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Amman' });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><div class="big">🗒️</div>ولا طلب ' + (currentFilter === 'today' ? 'اليوم لسا' : 'بعد') + '.</div>';
    return;
  }

  list.innerHTML = filtered.map(o => {
    const items = parseItems(o.items);
    const qty = o.quantity || items.length || 1;
    const total = o.total_price_jod != null
      ? Number(o.total_price_jod)
      : Number(o.price_jod || 0) + Number(o.delivery_fee_jod || 0);
    const addrParts = [o.city, o.address].filter(Boolean).join(' — ');

    const itemsHtml = items.length
      ? `<div class="items">${items.map((it, i) => `
        <div class="item-row">
          <span class="idx">${i + 1}.</span>
          <span>المقاس <b>${escapeHtml(it.size || o.size || '—')}</b></span>
          <span>اللون <b>${escapeHtml(it.color || '—')}</b></span>
          <span>الوزن <b>${escapeHtml(it.weight_kg ?? '—')}</b> كغم</span>
          <span>الطول <b>${escapeHtml(it.height_cm ?? '—')}</b> سم</span>
        </div>`).join('')}</div>`
      : `<div class="meta"><span>مقاس <b>${escapeHtml(o.size || '—')}</b></span></div>`;

    const notesHtml = o.notes ? `<div class="addr" style="color:var(--ink-dim); margin-top:4px;">ملاحظات: ${escapeHtml(o.notes)}</div>` : '';

    return `<div class="order">
      <div class="row1">
        <div class="name">${escapeHtml(o.customer_name || 'بدون اسم')} <span class="qty-badge">${qty} قطعة</span></div>
        <div class="time">${fmtTime(o.created_at)}</div>
      </div>
      <div class="meta">
        <span><b>${escapeHtml(o.delivery_phone || o.phone || '—')}</b></span>
        <span class="channel">${channelLabel(o.channel)}</span>
      </div>
      ${itemsHtml}
      <div class="addr">${escapeHtml(addrParts || 'بدون عنوان')}</div>
      ${notesHtml}
      <div class="foot">
        <span class="price">${fmtMoney(total)}</span>
        <span style="font-size:0.78rem; color:var(--ink-dim);">${escapeHtml(o.product_code || '')}</span>
      </div>
    </div>`;
  }).join('');
}

function parseItems(items) {
  if (!items) return [];
  if (Array.isArray(items)) return items;
  try {
    const parsed = JSON.parse(items);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadOrders() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  try {
    const res = await fetch(ENDPOINT, { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const text = await res.text();
    allOrders = text ? JSON.parse(text) : [];
    allOrders.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="error">تعذر تحميل الطلبات. جرب تضغط تحديث. (' + escapeHtml(e.message) + ')</div>';
  } finally {
    btn.classList.remove('loading');
  }
}

function exportExcel() {
  const filtered = currentFilter === 'today' ? allOrders.filter(o => isToday(o.created_at)) : allOrders;
  if (!filtered.length) { alert('ولا طلب للتصدير.'); return; }

  const rows = [];
  filtered.forEach(o => {
    const items = parseItems(o.items);
    const addrParts = [o.city, o.address].filter(Boolean).join(' — ');
    const total = o.total_price_jod != null
      ? Number(o.total_price_jod)
      : Number(o.price_jod || 0) + Number(o.delivery_fee_jod || 0);
    const baseRow = {
      'رقم الطلب': o.id ?? '',
      'التاريخ والوقت': fmtTime(o.created_at),
      'القناة': channelLabel(o.channel),
      'اسم الزبون': o.customer_name || '',
      'رقم الهاتف': o.delivery_phone || o.phone || '',
      'العنوان': addrParts,
      'ملاحظات': o.notes || '',
      'المنتج': o.product_code || '',
      'عدد القطع': o.quantity || items.length || 1,
      'سعر القطع (د.أ)': o.price_jod ?? '',
      'أجرة التوصيل (د.أ)': o.delivery_fee_jod ?? '',
      'المجموع (د.أ)': total
    };
    if (items.length) {
      items.forEach((it, i) => {
        rows.push(Object.assign({}, baseRow, {
          'رقم القطعة': i + 1,
          'المقاس': it.size || o.size || '',
          'اللون': it.color || '',
          'الوزن (كغم)': it.weight_kg ?? '',
          'الطول (سم)': it.height_cm ?? ''
        }));
      });
    } else {
      rows.push(Object.assign({}, baseRow, {
        'رقم القطعة': 1,
        'المقاس': o.size || '',
        'اللون': '',
        'الوزن (كغم)': '',
        'الطول (سم)': ''
      }));
    }
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الطلبات');
  const dateStr = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Amman' });
  XLSX.writeFile(wb, `طلبات-${dateStr}.xlsx`);
}

document.getElementById('filters').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
  btn.setAttribute('aria-pressed', 'true');
  currentFilter = btn.dataset.filter;
  render();
});

loadOrders();
setInterval(loadOrders, 60000);
</script>
